<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Interview Assistant Settings</title>

    <link
        rel="stylesheet"
        href="options.css"
    >

</head>


<body>

    <main class="container">

        <div class="card">

            <h1>
                AI Interview Assistant
            </h1>

            <p class="subtitle">
                Extension Settings
            </p>


            <label>
                Gemini API Key
            </label>

            <input
                id="apiKey"
                type="password"
                placeholder="Enter your Gemini API key"
            >


            <p class="help">

                Your API key is stored locally in
                Chrome extension storage.

            </p>


            <button id="saveBtn">
                Save Settings
            </button>


            <div
                id="message"
                class="message"
            ></div>


            <hr>


            <h2>
                About
            </h2>

            <p>

                AI Interview Assistant helps you
                prepare for technical and HR interviews,
                practice mock interviews and analyze
                job descriptions.

            </p>

            <p>

                Version 1.0.0

            </p>

        </div>

    </main>


    <script src="options.js"></script>

</body>

</html>
